<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="framework.css">
  <meta charset="UTF-8">
  <title>Plantillas Ejecutivas IA</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <header>
    <div class="headerContent">
      <h1 data-i18n="framework.title">Plantillas Ejecutivas IA</h1>
      <nav class="headerNav">
        <a href="index.html" class="navLink">
          <i data-lucide="book-open" class="navIcon" aria-hidden="true"></i>
          <span data-i18n="nav.prompts">Prompts</span>
        </a>
        <a href="agents.html" class="navLink">
          <i data-lucide="bot" class="navIcon" aria-hidden="true"></i>
          <span data-i18n="nav.agents">Agentes</span>
        </a>
        <a href="framework.html" class="navLink active">
          <i data-lucide="layout-template" class="navIcon" aria-hidden="true"></i>
          <span data-i18n="nav.frameworks">Plantillas Ejecutivas</span>
        </a>
        <a href="dpc.html" class="navLink">
          <i data-lucide="shield-check" class="navIcon" aria-hidden="true"></i>
          <span data-i18n="nav.dpc">DPC Check</span>
        </a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="frameworkIntro">
      <h2 data-i18n="framework.intro.title">Plantillas Ejecutivas para generar prompts estratégicos</h2>
      <p class="heroSubtitle" data-i18n="framework.intro.subtitle">Completa los campos y genera un prompt adaptado a tu rol y contexto.</p>
    </div>

    <div class="frameworkLayout">
      <aside class="frameworkSidebar">
        <h3 data-i18n="framework.sidebar.title">Plantillas Disponibles</h3>
        <div id="frameworkTabs"></div>
      </aside>

      <main class="frameworkContent">
        <div id="frameworkDetail">
          <div class="emptyState" data-i18n="framework.empty">
            Selecciona una plantilla de la lista
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="sanitize.js?v=3"></script>
  <script src="i18n.js?v=3"></script>
  <script src="framework.js?v=3"></script>

  <!-- Framework Onboarding Tour — same structure as index.html -->
  <div id="tourWelcome" class="tourWelcome" aria-modal="true" role="dialog" hidden>
    <div class="tourWelcomeBox">
      <p id="tourWelcomeTitle" class="tourWelcomeTitle"></p>
      <p id="tourWelcomeBody" class="tourWelcomeBody"></p>
      <div class="tourWelcomeBtns">
        <button id="tourStartBtn" class="tourBtnPrimary" type="button"></button>
        <button id="tourSkipWelcome" class="tourBtnGhost" type="button"></button>
      </div>
    </div>
  </div>
  <div id="tourBackdrop" class="tourBackdrop" hidden></div>
  <div id="tourHighlight" class="tourHighlight" aria-hidden="true" hidden></div>
  <div id="tourTooltip" class="tourTooltip" role="tooltip" hidden>
    <p id="tourTooltipText" class="tourTooltipText"></p>
    <div class="tourTooltipFooter">
      <span id="tourProgress" class="tourProgress"></span>
      <div class="tourTooltipBtns">
        <button id="tourSkipBtn" class="tourBtnGhost tourBtnSm" type="button"></button>
        <button id="tourPrevBtn" class="tourBtnSec tourBtnSm" type="button" hidden></button>
        <button id="tourNextBtn" class="tourBtnPrim tourBtnSm" type="button"></button>
      </div>
    </div>
  </div>
  <button id="tourReplayBtn" class="tourReplayBtn" type="button">
    <i data-lucide="play-circle" class="btnIcon" aria-hidden="true"></i>
    <span></span>
  </button>
  <script>if (window.lucide) lucide.createIcons();</script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
